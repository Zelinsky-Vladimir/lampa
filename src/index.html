<!doctype html>
<html lang="en" data-mode="home">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data: lampa-cover:; font-src 'self'; connect-src https://lxztjateewlladvgzzlj.supabase.co http://127.0.0.1:54321 https://*.r2.cloudflarestorage.com">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lampa</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="sync-bar" hidden></div>
  <header id="bar">
    <div class="bar-brand home-only">Lampa</div>
    <div class="bar-group reader-only" id="nav-group">
      <button class="icon-btn" id="btn-home" data-i18n-title="library">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
    </div>
    <div class="bar-group reader-only" id="toc-group">
      <button class="icon-btn" id="btn-toc" data-i18n-title="tocBtn">
        <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>
      </button>
    </div>
    <div id="bar-title" class="reader-only"><span id="bar-book"></span><span id="bar-chapter"></span></div>
    <div class="spacer home-only"></div>

    <div class="bar-group reader-only wide-actions">
      <button class="icon-btn" id="btn-search" data-i18n-title="searchBtn">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      </button>
      <button class="icon-btn" id="btn-bookmark" data-i18n-title="bookmarkBtn">
        <svg viewBox="0 0 24 24"><path d="M7 4.5h10v15.5l-5-3.8-5 3.8z"/></svg>
      </button>
      <button class="icon-btn no-phone" id="btn-auto" data-i18n-title="autoBtn">
        <svg viewBox="0 0 24 24"><path d="M12 4v14M6.5 12.5 12 18l5.5-5.5M6 21h12"/></svg>
      </button>
    </div>

    <div class="bar-group">
      <button class="icon-btn reader-only wide-actions" id="btn-full" data-i18n-title="fullBtn">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <div class="size-step reader-only wide-only" id="bar-size" role="group" data-i18n-aria="size">
        <button class="size-down" data-i18n-title="sizeDown">A</button><span class="size-val"></span><button class="size-up" data-i18n-title="sizeUp">A</button>
      </div>
      <button class="icon-btn eye-btn reader-only" id="btn-settings" data-i18n-title="settingsBtn">
        <svg viewBox="0 0 24 24"><path d="M2.8 13c2.3-3.4 5.5-5.2 9.2-5.2s6.9 1.8 9.2 5.2c-2.3 3.4-5.5 5.2-9.2 5.2S5.1 16.4 2.8 13z"/><circle cx="12" cy="13" r="2.7"/><path d="M12 2.4v2.3M5.4 4.3l1.3 1.8M18.6 4.3l-1.3 1.8M1.8 7.6l1.9 1.1M22.2 7.6l-1.9 1.1M7.4 20.6l-.7 1.3M16.6 20.6l.7 1.3"/></svg>
      </button>
      <button class="icon-btn account-btn" id="btn-account" data-i18n-title="accountTitle">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 19.5c1.3-3.4 3.8-5.1 7-5.1s5.7 1.7 7 5.1"/></svg>
        <span class="acct-initial"></span><i class="acct-dot"></i>
      </button>
    </div>
  </header>

  <main id="home">
    <div class="home-inner">
      <nav class="home-tabs" id="home-tabs">
        <button data-tab="library" data-i18n="library"></button>
        <button data-tab="read"><span data-i18n="tabRead"></span><span class="count"></span></button>
        <button data-tab="want"><span data-i18n="tabWant"></span><span class="count"></span></button>
      </nav>
      <div id="home-library">
      <div class="home-top" id="home-top" hidden>
        <section class="cont-card" id="cont-card">
          <div class="cont-cover" id="cont-cover"></div>
          <div class="cont-info">
            <div class="cont-over" data-i18n="continueReading"></div>
            <div class="cont-title" id="cont-title"></div>
            <div class="cont-author" id="cont-author"></div>
            <div class="cont-bar"><i id="cont-fill"></i></div>
            <div class="cont-meta"><span id="cont-page"></span><span id="cont-pct"></span></div>
            <div class="cont-actions">
              <button class="primary-btn" id="home-continue">
                <svg viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z"/></svg>
                <span data-i18n="continueBtn"></span>
              </button>
              <button class="ghost-btn" id="cont-mark-read">
                <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
                <span data-i18n="markRead"></span>
              </button>
            </div>
          </div>
        </section>
        <aside class="up-next" id="up-next" hidden>
          <h2 data-i18n="upNext"></h2>
          <div id="up-next-list"></div>
          <button class="link-btn" id="up-next-all"></button>
        </aside>
      </div>
      <section class="hero" id="home-empty">
        <img class="logo-icon" src="../build/icon.png" alt="">
        <div class="logo">Lampa</div>
        <p class="tagline" data-i18n="tagline"></p>
        <div class="hero-actions">
          <button class="primary-btn" id="home-open">
            <svg viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>
            <span data-i18n="openBook"></span>
          </button>
        </div>
        <p class="hint" data-i18n="dropHint"></p>
      </section>
      <button class="add-book" id="home-add" hidden>
        <span class="add-icon"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
        <span class="add-text"><b data-i18n="addBook"></b><span data-i18n="addBookFormats"></span></span>
      </button>
      <section id="recent-section" hidden>
        <div class="section-head">
          <h2 class="section-title" data-i18n="recent"></h2>
          <button class="link-btn" id="recent-all" hidden></button>
        </div>
        <div class="grid" id="recent"></div>
        <p class="recent-empty" id="recent-empty" data-i18n="recentEmpty" hidden></p>
      </section>
      </div>

      <section id="all-view" hidden>
        <div class="all-head">
          <button class="icon-btn" id="all-back" data-i18n-title="library"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
          <h1><span data-i18n="allBooks"></span> <span class="count" id="all-count"></span></h1>
        </div>
        <div class="shelf-tools">
          <div class="search-field">
            <input id="all-filter" type="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="allFilter">
          </div>
          <div class="chips" id="all-chips" role="group"></div>
        </div>
        <div class="grid" id="all-grid"></div>
        <p class="shelf-empty" id="all-empty" hidden></p>
      </section>

      <section id="shelf-view" hidden>
        <div class="shelf-tools">
          <div class="search-field">
            <input id="shelf-filter" type="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="shelfFilter">
            <div class="search-progress"></div>
          </div>
          <label class="sort-btn" id="sort-btn" data-i18n-title="sortOrder">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M7 12h10M10 17h4"/></svg>
            <select id="shelf-sort"></select>
          </label>
          <div class="chips" id="shelf-chips" role="group"></div>
          <select id="shelf-genre" hidden></select>
        </div>
        <div class="shelf-stats" id="shelf-stats"></div>
        <div class="grid" id="shelf-grid"></div>
        <p class="shelf-empty" id="shelf-empty" hidden></p>
        <div id="shelf-other" hidden>
          <h2 class="section-title" id="shelf-other-title"></h2>
          <div class="grid" id="shelf-other-grid"></div>
        </div>
        <div id="shelf-online" hidden>
          <h2 class="section-title" data-i18n="shelfOnline"></h2>
          <div class="shelf-stats" id="shelf-online-status"></div>
          <div class="grid" id="shelf-online-grid"></div>
          <p class="dlg-foot shelf-manual">
            <span data-i18n="shelfNotFound"></span>
            <button type="button" class="link-btn" id="shelf-manual" data-i18n="shelfManual"></button>
          </p>
        </div>
      </section>
    </div>
  </main>

  <div id="scroller" tabindex="-1" hidden>
    <article id="book"></article>
  </div>
  <div id="progress" class="reader-only"><div id="progress-fill"></div></div>
  <div id="mini-page" class="reader-only"></div>

  <footer id="footer" class="reader-only">
    <div class="size-step" id="foot-size" role="group" data-i18n-aria="size">
      <button class="size-down" data-i18n-title="sizeDown">A</button><span class="size-val"></span><button class="size-up" data-i18n-title="sizeUp">A</button>
    </div>
    <div id="foot-chapter"></div>
    <div class="scrub-wrap">
      <div id="scrub-ticks"></div>
      <i id="scrub-ghost" hidden></i>
      <input type="range" id="scrub" min="1" max="1" step="1" value="1" data-i18n-aria="progressAria">
      <div id="scrub-tip" hidden><b id="scrub-tip-page"></b><span id="scrub-tip-info"></span></div>
    </div>
    <div id="foot-info"><span id="fi-ch"></span><span id="fi-pct"></span></div>
    <button class="page-btn" id="page-btn" data-i18n-title="pageInputTitle">
      <span id="page-label"></span><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>
    </button>
  </footer>

  <div id="goto-pop" role="dialog" hidden>
    <div class="goto-head"><span data-i18n="gotoTitle"></span><button class="link-btn" id="goto-cancel" data-i18n="cancel"></button></div>
    <div class="goto-row">
      <input id="page-input" type="text" inputmode="numeric" autocomplete="off" enterkeyhint="go" data-i18n-aria="pageLabel">
      <span class="muted" id="page-total"></span>
      <button class="primary-btn" id="goto-go" data-i18n="gotoGo"></button>
    </div>
    <div class="goto-info" id="goto-info"></div>
    <div class="goto-hint" id="goto-hint"></div>
  </div>

  <section id="end-card" role="dialog" hidden>
    <div class="end-over" data-i18n="endOver"></div>
    <div class="end-title" id="end-title"></div>
    <div class="end-ask" data-i18n="endAsk"></div>
    <div class="end-stars" id="end-stars" role="radiogroup"></div>
    <div class="end-val" id="end-val"></div>
    <div class="end-actions">
      <button class="ghost-btn" id="end-later" data-i18n="endLater"></button>
      <button class="primary-btn" id="end-save" data-i18n="endSave"></button>
    </div>
  </section>

  <div id="scrim"></div>

  <aside class="panel left" id="toc-panel">
    <header>
      <div class="tabs" role="tablist">
        <button data-tab="toc" class="active" data-i18n="tabToc"></button>
        <button data-tab="bookmarks"><span data-i18n="tabBookmarks"></span> <span class="count" id="bm-count"></span></button>
        <button data-tab="notes"><span data-i18n="tabNotes"></span> <span class="count" id="note-count"></span></button>
      </div>
      <button class="icon-btn" data-close data-i18n-title="close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </header>
    <nav class="body" id="toc" data-tab-body="toc"></nav>
    <div class="body" id="bookmarks-list" data-tab-body="bookmarks" hidden></div>
    <div class="body" id="notes-list" data-tab-body="notes" hidden></div>
  </aside>

  <aside class="panel right" id="search-panel">
    <header>
      <h3 data-i18n="search"></h3>
      <button class="icon-btn" id="search-close" data-i18n-title="close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </header>
    <div class="search-box">
      <input id="search-input" type="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="searchPlaceholder">
      <div class="search-nav">
        <span id="search-count"></span>
        <button class="icon-btn" id="search-prev" data-i18n-title="prevMatch"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button>
        <button class="icon-btn" id="search-next" data-i18n-title="nextMatch"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
      </div>
    </div>
    <div class="body" id="search-results"></div>
  </aside>

  <aside class="panel right" id="settings-panel">
    <header>
      <h3 data-i18n="appearance"></h3>
      <button class="icon-btn" data-close data-i18n-title="close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </header>
    <div class="body">
      <div class="setting color-controls" id="settings-bright"></div>
      <div class="setting">
        <div class="label" data-i18n="theme"></div>
        <div class="themes" id="themes"></div>
      </div>
      <div class="setting">
        <div class="label" data-i18n="font"></div>
        <div class="font-chips" id="font-chips"></div>
      </div>
      <div class="setting steps">
        <div class="step-row"><span data-i18n="size"></span>
          <div class="stepper" id="size-stepper"><button class="size-down" data-i18n-title="sizeDown">A−</button><span class="size-val"></span><button class="size-up" data-i18n-title="sizeUp">A+</button></div>
        </div>
        <div class="step-row"><span data-i18n="lineHeight"></span>
          <div class="stepper"><button id="lh-down" data-i18n-title="lhDown">−</button><span id="line-height-val"></span><button id="lh-up" data-i18n-title="lhUp">+</button></div>
        </div>
        <div class="step-row"><span data-i18n="readingMode"></span>
          <div class="seg" data-key="view">
            <button data-value="pages" data-i18n="modePages"></button>
            <button data-value="scroll" data-i18n="modeScroll"></button>
          </div>
        </div>
      </div>
      <details class="ap-more">
        <summary data-i18n="moreAppearance"></summary>
        <div class="setting color-controls" id="settings-colors"></div>
      <div class="setting">
        <label class="label" for="width"><span data-i18n="columnWidth"></span> <span id="width-val"></span></label>
        <input type="range" id="width" min="480" max="2400" step="20">
      </div>
      <div class="setting">
        <div class="label" data-i18n="alignment"></div>
        <div class="seg" data-key="justify">
          <button data-value="true" data-i18n="justify"></button>
          <button data-value="false" data-i18n="alignLeft"></button>
        </div>
      </div>
      <div class="setting">
        <div class="label" data-i18n="paragraphs"></div>
        <div class="seg" data-key="indent">
          <button data-value="true" data-i18n="indent"></button>
          <button data-value="false" data-i18n="spacing"></button>
        </div>
      </div>
      <div class="setting pages-only">
        <div class="label" data-i18n="pageAnim"></div>
        <select id="page-anim"></select>
      </div>
      <div class="setting">
        <div class="label" data-i18n="footerBar"></div>
        <div class="seg" data-key="footerAlways">
          <button data-value="true" data-i18n="alwaysVisible"></button>
          <button data-value="false" data-i18n="hideWhileReading"></button>
        </div>
      </div>
      <div class="setting">
        <div class="label" data-i18n="progressLine"></div>
        <div class="seg" data-key="progressLine">
          <button data-value="true" data-i18n="progressShow"></button>
          <button data-value="false" data-i18n="progressHide"></button>
        </div>
      </div>
      <div class="setting no-phone">
        <label class="label" for="auto-speed"><span data-i18n="autoSpeed"></span> <span id="auto-speed-val"></span></label>
        <input type="range" id="auto-speed" min="10" max="300" step="5">
      </div>
        <button class="text-btn" id="reset-settings" data-i18n="reset"></button>
      </details>
    </div>
  </aside>

  <aside class="panel right" id="account-panel">
    <header>
      <h3 data-i18n="accountTitle"></h3>
      <button class="icon-btn" data-close data-i18n-title="close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </header>
    <div class="body">
      <div class="setting sync-box">
        <div class="label" data-i18n="syncTitle"></div>
        <div id="sync-out">
          <p class="setting-hint" data-i18n="syncPitch"></p>
          <button class="sync-apple" id="sync-apple" hidden>
            <svg viewBox="0 0 24 24"><path d="M16.4 12.6c0-2.3 1.9-3.4 2-3.4-1.1-1.6-2.7-1.8-3.3-1.8-1.4-.1-2.7.8-3.4.8-.7 0-1.8-.8-3-.8-1.5 0-2.9.9-3.7 2.3-1.6 2.7-.4 6.8 1.1 9 .8 1.1 1.7 2.3 2.8 2.3 1.1 0 1.6-.7 2.9-.7 1.4 0 1.8.7 3 .7 1.2 0 2-1.1 2.7-2.2.9-1.3 1.2-2.5 1.2-2.6 0 0-2.4-.9-2.3-3.6zM14.1 5.9c.6-.8 1-1.8.9-2.9-.9 0-2 .6-2.6 1.4-.6.7-1.1 1.7-1 2.8 1 .1 2.1-.5 2.7-1.3z"/></svg>
            <span data-i18n="syncApple"></span>
          </button>
          <button class="primary-btn sync-google" id="sync-google">
            <svg viewBox="0 0 24 24"><path d="M20.5 12.2c0-.6-.1-1.2-.2-1.7H12v3.3h4.8a4.1 4.1 0 0 1-1.8 2.7v2.2h2.9c1.7-1.6 2.6-3.9 2.6-6.5zM12 21c2.4 0 4.4-.8 5.9-2.2l-2.9-2.2c-.8.5-1.8.9-3 .9-2.3 0-4.3-1.6-5-3.7H4v2.3A9 9 0 0 0 12 21zM7 13.8a5.4 5.4 0 0 1 0-3.5V8H4a9 9 0 0 0 0 8.1zM12 6.6c1.3 0 2.5.5 3.4 1.3l2.6-2.6A9 9 0 0 0 4 8l3 2.3c.7-2.1 2.7-3.7 5-3.7z"/></svg>
            <span data-i18n="syncGoogle"></span>
          </button>
          <details class="sync-email">
            <summary data-i18n="syncEmailToggle"></summary>
            <input id="sync-email" type="email" autocomplete="username" spellcheck="false" data-i18n-placeholder="syncEmail">
            <input id="sync-password" type="password" autocomplete="current-password" data-i18n-placeholder="syncPassword">
            <div class="sync-row">
              <button class="text-btn" id="sync-signin" data-i18n="syncSignIn"></button>
              <button class="text-btn" id="sync-signup" data-i18n="syncSignUp"></button>
            </div>
          </details>
        </div>
        <div id="sync-in" hidden>
          <div class="sync-card">
            <div class="sync-head">
              <div class="sync-avatar" id="sync-avatar"></div>
              <div class="sync-who">
                <div class="sync-user" id="sync-user"></div>
                <div class="sync-status" id="sync-status-row" role="button" tabindex="-1"><i class="sync-dot"></i><span id="sync-status"></span></div>
              </div>
            </div>
            <div class="sync-usage" id="sync-usage" hidden>
              <div class="sync-usage-bar"><i id="sync-usage-fill"></i></div>
              <div class="sync-usage-text" id="sync-usage-text"></div>
            </div>
            <div class="sync-row">
              <button class="sync-btn" id="sync-signout" data-i18n="syncSignOut"></button>
            </div>
          </div>
          <button class="sync-delete" id="sync-delete" data-i18n="syncDelete"></button>
        </div>
        <p class="setting-hint" id="sync-message"></p>
      </div>
      <div class="setting">
        <label class="label" for="lang" data-i18n="language"></label>
        <select id="lang"></select>
      </div>
      <div class="setting" id="translate-setting">
        <label class="label" for="translate-to" data-i18n="translateTo"></label>
        <select id="translate-to"></select>
        <p class="setting-hint" id="translate-privacy" data-i18n="translatePrivacy"></p>
        <button class="text-btn" id="tr-prepare" hidden></button>
      </div>

      <div class="setting about">
        <a class="about-row" href="https://zelinsky-vladimir.github.io/lampa-releases/support.html" data-external><span data-i18n="support"></span><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></a>
        <a class="about-row" href="https://zelinsky-vladimir.github.io/lampa-releases/privacy.html" data-external><span data-i18n="privacy"></span><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></a>
        <div class="about-row"><span data-i18n="version"></span><span class="muted" id="app-version"></span></div>
      </div>
      <div class="setting shortcuts">
        <div class="label" data-i18n="keys"></div>
        <dl id="shortcuts"></dl>
      </div>
    </div>
  </aside>

  <div id="note-pop" hidden></div>

  <div id="tr-pop" hidden>
    <div class="tr-head"><span id="tr-src"></span><select id="tr-to" class="tr-to" data-i18n-title="translateTo" data-i18n-aria="translateTo"></select></div>
    <div id="tr-main"></div>
    <div class="tr-actions">
      <button class="primary-btn" id="tr-download" data-i18n="translateDownload" hidden></button>
      <button class="text-btn" id="tr-copy" data-i18n="copy"></button>
      <button class="text-btn" id="tr-save" data-i18n="saveAsNote"></button>
    </div>
    <div id="tr-dict"></div>
    <div id="tr-context" hidden>
      <div class="tr-label" data-i18n="inSentence"></div>
      <div id="tr-orig"></div>
      <div id="tr-sentence"></div>
    </div>
  </div>

  <div id="sel-bar" hidden>
    <button class="sw" data-color="yellow" data-i18n-title="colorYellow"></button>
    <button class="sw" data-color="green" data-i18n-title="colorGreen"></button>
    <button class="sw" data-color="blue" data-i18n-title="colorBlue"></button>
    <button class="sw" data-color="pink" data-i18n-title="colorPink"></button>
    <span class="sep"></span>
    <button class="sel-btn" id="sel-translate" data-i18n-title="translateTitle">
      <svg viewBox="0 0 24 24"><path d="M4 5h9M8.5 3v2M6 5c.7 3.2 2.8 5.8 6 7.2M11 5c-.8 3.6-3.2 6.4-7 8"/><path d="m12.5 21 4-10 4 10M14 17.5h5"/></svg><span data-i18n="translate"></span>
    </button>
    <button class="sel-btn" id="sel-note" data-i18n-title="addNote">
      <svg viewBox="0 0 24 24"><path d="M5 19h4L19 9l-4-4L5 15zM13 7l4 4"/></svg><span data-i18n="note"></span>
    </button>
    <button class="sel-btn" id="sel-remove" data-i18n-title="removeHighlight" hidden>
      <svg viewBox="0 0 24 24"><path d="M5 7h14M10 11v6M14 11v6M6.5 7l1 12.5h9l1-12.5M9.5 7V4.5h5V7"/></svg><span data-i18n="removeHighlight"></span>
    </button>
    <button class="sel-btn" id="sel-copy" data-i18n-title="copy">
      <svg viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="12" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg><span data-i18n="copy"></span>
    </button>
  </div>

  <div id="annot-pop" hidden>
    <div class="annot-quote" id="annot-quote"></div>
    <textarea id="annot-text" rows="3" data-i18n-placeholder="notePlaceholder"></textarea>
    <div class="annot-row">
      <div class="annot-colors" id="annot-colors">
        <button class="sw" data-color="yellow" data-i18n-title="colorYellow"></button>
        <button class="sw" data-color="green" data-i18n-title="colorGreen"></button>
        <button class="sw" data-color="blue" data-i18n-title="colorBlue"></button>
        <button class="sw" data-color="pink" data-i18n-title="colorPink"></button>
      </div>
      <button class="text-btn" id="annot-delete" data-i18n="delete"></button>
      <button class="primary-btn" id="annot-save" data-i18n="done"></button>
    </div>
  </div>

  <div id="book-dlg" hidden>
    <div class="dlg-box" role="dialog" aria-modal="true" aria-labelledby="dlg-heading">
      <header>
        <h3 id="dlg-heading"></h3>
        <button class="icon-btn" id="dlg-close" data-i18n-title="close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </header>
      <div id="dlg-search">
        <input id="book-q" type="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="shelfSearchPh">
        <div id="book-status"></div>
        <div id="book-results"></div>
        <div class="dlg-foot" id="book-manual-row">
          <span data-i18n="shelfNotFound"></span>
          <button type="button" class="link-btn" id="book-manual" data-i18n="shelfManual"></button>
        </div>
      </div>
      <form id="dlg-edit" hidden autocomplete="off">
        <div class="ed-side">
          <div id="ed-cover"></div>
          <button type="button" class="link-btn" id="ed-find-cover" data-i18n="findCover"></button>
        </div>
        <div class="ed-main">
          <label class="fld"><span data-i18n="fTitle"></span><input id="ed-title" maxlength="300"></label>
          <label class="fld"><span data-i18n="fAuthor"></span><input id="ed-author" maxlength="300"></label>
          <div class="ed-world" id="ed-world" hidden></div>
          <div class="fld-row">
            <label class="fld fld-year"><span data-i18n="fYear"></span><input id="ed-year" inputmode="numeric" maxlength="4"></label>
            <label class="fld"><span data-i18n="fGenre"></span><select id="ed-genre"></select></label>
            <label class="fld read-fld"><span data-i18n="fFinished"></span><input id="ed-finished" type="date"></label>
          </div>
          <div class="seg" id="ed-list">
            <button type="button" data-value="read" data-i18n="tabRead"></button>
            <button type="button" data-value="want" data-i18n="tabWant"></button>
          </div>
          <div class="fld read-fld">
            <span class="fld-label"><span data-i18n="fRating"></span><b id="ed-rating-val"></b></span>
            <div id="ed-stars"></div>
          </div>
          <label class="fld"><span data-i18n="fNote"></span><textarea id="ed-note" rows="3" maxlength="5000"></textarea></label>
          <div class="ed-actions">
            <button type="button" class="link-btn" id="ed-back" data-i18n="backToSearch"></button>
            <button type="button" class="text-btn" id="ed-delete" data-i18n="delete"></button>
            <span class="spacer"></span>
            <button type="submit" class="primary-btn" data-i18n="save"></button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <button id="back-btn" hidden data-i18n="back"></button>

  <div id="auto-pill" hidden>
    <button class="icon-btn" id="auto-stop" data-i18n-title="autoStop"><svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg></button>
    <span class="auto-label" data-i18n="autoLabel"></span>
    <button class="icon-btn txt" id="auto-slower" data-i18n-title="slower">−</button>
    <span id="auto-speed-label"></span>
    <button class="icon-btn txt" id="auto-faster" data-i18n-title="faster">+</button>
  </div>

  <div id="drop-overlay" data-i18n="dropHere"></div>
  <div id="dim"></div>
  <canvas id="curl" hidden></canvas>

  <div id="ctx" hidden><div class="ctx-menu" id="ctx-menu" role="menu"></div></div>
  <div id="confirm-dlg" hidden>
    <div class="cf-box" role="alertdialog" aria-labelledby="cf-title">
      <div class="cf-head"><div class="cf-cover" id="cf-cover"></div><div class="cf-titles"><div class="cf-title" id="cf-title"></div><div class="cf-sub" id="cf-sub"></div></div></div>
      <p class="cf-text" id="cf-text"></p>
      <div class="cf-actions">
        <button class="ghost-btn" id="cf-cancel" data-i18n="cancel"></button>
        <button class="danger-btn" id="cf-ok"></button>
      </div>
    </div>
  </div>
  <div id="undo-toast" role="status" hidden><span id="undo-text"></span><button id="undo-btn" data-i18n="undo"></button></div>
  <div id="toast" role="status"></div>
  <div id="sync-jump" role="status" hidden>
    <span id="sync-jump-text"></span>
    <button class="primary-btn" id="sync-jump-go" data-i18n="syncJumpGo"></button>
    <button class="icon-btn" id="sync-jump-close" data-i18n-title="close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div id="update-banner" role="status" hidden>
    <span id="update-text"></span>
    <button class="primary-btn" id="update-restart" data-i18n="restart"></button>
    <button class="icon-btn" id="update-later" data-i18n-title="updateLater"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>

  <script src="i18n.js"></script>
  <script src="decode.js"></script>
  <script src="parsers.js"></script>
  <script src="stamps.js"></script>
  <script src="cloud.js"></script>
  <script src="app.js"></script>
</body>
</html>
