name: iOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - run: npm run build:mobile

      - run: npx cap sync ios

      - name: Build for the iOS simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build | tail -40

      - name: Run in the simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          print(next(x['udid'] for k, v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/ios/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch --console-pty "$DEVICE" io.github.zelinskyvladimir.lampa > launch.log 2>&1 &
          sleep 30
          xcrun simctl io "$DEVICE" screenshot home.png
          grep -i "lampa\|error" launch.log | head -40 || true
          grep -q "\[lampa\] ready" launch.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator
          retention-days: 2
          path: |
            home.png
            launch.log
